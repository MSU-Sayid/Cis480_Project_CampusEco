<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/driver.css">
</head>
<body>

<header>
    <h1>Driver Dashboard</h1>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="driver.html" aria-current="page">Driver</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<main>

    <!-- Confirmation / error messages (filled by js/driver.js) -->
    <div id="driver-message" class="msg" role="status" aria-live="polite" hidden></div>

    <section class="route-box">
        <h2>Route Queue</h2>

        <div class="queue-toolbar">
            <p id="queue-summary" class="queue-summary"></p>
            <button type="button" id="claim-selected">Claim Selected</button>
        </div>

        <table class="queue-table">
            <caption>Available Deliveries</caption>
            <thead>
                <tr>
                    <th scope="col">
                        <input type="checkbox" id="select-all" aria-label="Select all unclaimed deliveries">
                    </th>
                    <th scope="col">Tracking</th>
                    <th scope="col">Destination</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Status</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <!-- Rows are built from localStorage "packages" -->
            <tbody id="queue-body"></tbody>
        </table>
    </section>

    <section>
        <h2>Update Delivery Status</h2>

        <form id="status-form" novalidate>
            <label for="package">Package (claimed deliveries)</label>
            <select id="package" name="package" required>
                <option value="">Select package</option>
            </select>
            <p id="status-hint" class="hint"></p>

            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="">Select status</option>
                <option value="Loaded">Loaded</option>
                <option value="En Route">En Route</option>
                <option value="Delivered">Delivered</option>
            </select>

            <button type="submit">Update Status</button>
        </form>
    </section>

    <section>
        <h2>Vehicle Status</h2>

        <div id="battery-cards" class="battery-grid"></div>

        <form id="vehicle-form" novalidate>
            <label for="vehicle">Vehicle</label>
            <select id="vehicle" name="vehicle" required>
                <option value="">Select vehicle</option>
                <option value="Eco Cart 1">Eco Cart 1</option>
                <option value="Eco Cart 2">Eco Cart 2</option>
            </select>

            <label for="battery">Battery Level (%)</label>
            <input type="number" id="battery" name="battery"
                   min="0" max="100" step="1" inputmode="numeric" required>

            <button type="submit">Submit Vehicle Status</button>
        </form>
    </section>

</main>

<footer>MNSU CampusEco © 2026</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/driver.js"></script>
</body>
</html>
