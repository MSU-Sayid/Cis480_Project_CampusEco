<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/driver.css">
</head>
<body>

<header>
    <h1>Driver Dashboard</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="driver.html">Driver</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<main>

    <section class="route-box">
        <h2>Route Queue</h2>

        <table>
            <caption>Available Deliveries</caption>
            <thead>
                <tr>
                    <th scope="col">Tracking</th>
                    <th scope="col">Destination</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>PKG12345</td>
                    <td>Preska Hall</td>
                    <td>Normal</td>
                    <td><button type="button">Claim</button></td>
                </tr>
                <tr>
                    <td>PKG67890</td>
                    <td>CSU</td>
                    <td>Urgent</td>
                    <td><button type="button">Claim</button></td>
                </tr>
            </tbody>
        </table>
    </section>

    <section>
        <h2>Update Delivery Status</h2>

        <form>
            <label for="package">Package</label>
            <select id="package" name="package" required>
                <option value="">Select package</option>
                <option>PKG12345</option>
                <option>PKG67890</option>
            </select>

            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="">Select status</option>
                <option>Loaded</option>
                <option>En Route</option>
                <option>Delivered</option>
            </select>

            <button type="submit">Update Status</button>
        </form>
    </section>

    <section>
        <h2>Vehicle Status</h2>

        <form>
            <label for="vehicle">Vehicle</label>
            <select id="vehicle" name="vehicle" required>
                <option value="">Select vehicle</option>
                <option>Eco Cart 1</option>
                <option>Eco Cart 2</option>
            </select>

            <label for="battery">Battery Level (%)</label>
            <input type="number" id="battery" name="battery"
                   min="0" max="100" required>

            <button type="submit">Submit Vehicle Status</button>
        </form>
    </section>

</main>

<footer>MNSU CampusEco © 2026</footer>

</body>
</html>
