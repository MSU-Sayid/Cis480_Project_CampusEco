<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Registration - MNSU CampusEco</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header>
    <h1>MNSU CampusEco</h1>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="login.html" aria-current="page">Login / Register</a>
    </nav>
</header>

<main class="account-layout">

    <section>
        <h2>Login</h2>
        <p class="form-intro">Sign in and choose the portal for your role.</p>

        <form id="login-form" novalidate>
            <label for="login-id">MNSU ID</label>
            <input type="text" id="login-id" name="login-id" minlength="6" maxlength="20" required>

            <label for="login-password">Password</label>
            <div class="password-row">
                <input type="password" id="login-password" name="login-password" minlength="8" required>
                <button type="button" class="secondary-button password-toggle" data-target="login-password">Show</button>
            </div>

            <label for="login-role">Role</label>
            <select id="login-role" name="login-role" required>
                <option value="">Select role</option>
                <option value="operator">Operator</option>
                <option value="driver">Driver</option>
                <option value="recipient">Student / Faculty / Staff</option>
            </select>

            <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit">Login</button>
        </form>
    </section>

    <section>
        <h2>Create Account</h2>
        <p class="form-intro">Create a browser-based account for the Phase 2 prototype.</p>

        <form id="register-form" novalidate>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="register-email">MNSU Email</label>
            <input type="email" id="register-email" name="register-email" placeholder="name@mnsu.edu" required>

            <label for="register-id">MNSU ID</label>
            <input type="text" id="register-id" name="register-id" pattern="[A-Za-z0-9]{6,20}" minlength="6" maxlength="20" required>

            <label for="register-password">Password</label>
            <div class="password-row">
                <input type="password" id="register-password" name="register-password" minlength="8" required>
                <button type="button" class="secondary-button password-toggle" data-target="register-password">Show</button>
            </div>

            <label for="register-role">Role</label>
            <select id="register-role" name="register-role" required>
                <option value="">Select role</option>
                <option value="operator">Operator</option>
                <option value="driver">Driver</option>
                <option value="recipient">Student / Faculty / Staff</option>
            </select>

            <p id="register-message" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit">Register</button>
        </form>
    </section>

</main>

<footer>MNSU CampusEco © 2026</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
